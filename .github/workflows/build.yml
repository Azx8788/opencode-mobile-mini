name: Android arm64 build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The version lives in pubspec.yaml. Everything downstream (artifact
      # name, APK name, tag check) derives from this one place so a build can
      # never be labelled with a number the app does not carry.
      - name: Read the app version
        id: app
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if [ -z "${VERSION}" ]; then
            echo "::error::pubspec.yaml has no version: line"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            CHANNEL=""
            ARTIFACT="opencode-mini-${VERSION}-arm64"
          else
            CHANNEL="-dev-${SHORT_SHA}"
            ARTIFACT="opencode-mini-${VERSION}${CHANNEL}-arm64"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "apk=opencode-mini-${VERSION}${CHANNEL}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "Building ${ARTIFACT} (app version ${VERSION})"

      # A tag is a promise about which build is being published. Refuse the
      # release when the tag and pubspec disagree, before spending 20 minutes
      # on a build that would ship under the wrong number.
      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          EXPECTED="v${{ steps.app.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match ${EXPECTED} in pubspec.yaml"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Write the release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret: building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/mini-release.p12"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/mini-release.p12
          storeType=PKCS12
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Smoke and sanity tests
        run: |
          flutter test \
            test/mini_agents_test.dart \
            test/mini_package_test.dart \
            test/mini_l10n_test.dart \
            test/token_count_format_test.dart \
            test/kit_field_secret_mask_test.dart \
            test/provider_probe_test.dart \
            test/provider_parameter_test.dart \
            test/model_switch_fit_test.dart \
            test/mini_l10n_catalogue_test.dart \
            test/agent_endpoint_test.dart \
            test/app_log_test.dart

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify and package the APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          ls -l "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | sed -n '1,6p'
          if unzip -l "$APK" | grep -qE "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "::error::APK contains non-arm64 native libraries"
            unzip -l "$APK" | grep -E "lib/(armeabi-v7a|x86|x86_64)/" | head
            exit 1
          fi
          # Ship the file under the name people will actually see in their
          # downloads folder, with a checksum beside it.
          mkdir -p dist
          OUT="${{ steps.app.outputs.apk }}"
          cp "$APK" "dist/${OUT}"
          (cd dist && sha256sum "${OUT}" > SHA256SUMS && cat SHA256SUMS)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.artifact }}
          path: dist/

      - name: Attach the APK to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenCode Mini ${{ steps.app.outputs.version }}
          body: |
            Built from ${{ github.sha }}.
            Verify the download against `SHA256SUMS`.
          files: |
            dist/*.apk
            dist/SHA256SUMS
          draft: true
